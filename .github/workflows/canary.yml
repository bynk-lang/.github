# The Bynk canary, as a reusable workflow. Each enrolled repository calls it
# from workflow-templates/bynk-canary.yml when the central dispatcher
# (dispatch-canary.yml) sends it a `bynk-canary` repository_dispatch.
#
# It runs the repository's checks against one Bynk release, then, in a result
# job that always runs: keeps one `canary` issue per break (opened on failure,
# commented on while it lasts, closed on the next pass), and posts the result
# to the compat board, authenticated by the run's GitHub OIDC token. With
# `bump`, a pass with a release newer than the repository's BYNK_VERSION also
# opens a pull request moving the pin to it.
# See canary/README.md.
name: Bynk canary

on:
  workflow_call:
    inputs:
      version:
        description: Bynk version to test, exact ("0.303.4") or "latest".
        type: string
        default: latest
      working-directory:
        description: Project root, the directory that holds bynk.toml.
        type: string
        default: "."
      source:
        description: Source path passed to bynk-ci, relative to working-directory. Use "." for a project with a tests/ directory.
        type: string
        default: src
      ci:
        description: Run bynk-ci (format check, type check, tests).
        type: boolean
        default: true
      format:
        description: >-
          Run bynk-ci's format check. On a directory `source`, this needs
          Bynk 0.307.0 or later: before that, `bynkc fmt` took files only.
        type: boolean
        default: true
      deploy-dry-run:
        description: Also run bynk-deploy@v2 with dry-run "true" (offline, no Cloudflare credentials).
        type: boolean
        default: false
      open-issue:
        description: Open, update or close a `canary` issue in the calling repository.
        type: boolean
        default: true
      kind:
        description: The repository's kind in canary/repos.json, `example`, `action`, `app` or `book`. Sent in the report.
        type: string
        default: example
      upstream-result:
        description: >-
          The result of checks the caller ran in its own jobs, at the same
          version (pass `needs.<job>.result`). Anything but `success` or
          `skipped` makes the canary fail, so one `canary` issue covers both.
          Empty (the default) when the caller runs no checks of its own.
        type: string
        default: ""
      report:
        description: >-
          Report the result to the compat board, authenticated by the run's
          GitHub OIDC token (the caller must grant `id-token: write`). The
          self-test turns it off.
        type: boolean
        default: true
      board-url:
        description: The compat board an OIDC report goes to (`<board-url>/v2/runs`), and the token's audience.
        type: string
        default: https://compat-board.bynk-lang.workers.dev
      fail-run:
        description: >-
          Fail the workflow run when the checks fail. The self-test sets false
          to assert on a deliberately broken fixture.
        type: boolean
        default: true
      bump:
        description: >-
          When the canary passes on the default branch with a final release
          newer than the repository's BYNK_VERSION file, open a pull request
          moving it (and any line marked `bynk-pin`) to that release, closing
          any bump for an older one. Needs the BUMP_APP_ID and BUMP_APP_KEY
          secrets (the caller passes `secrets: inherit`); without them it
          warns and skips.
        type: boolean
        default: false
      bump-auto-merge:
        description: >-
          Turn on auto-merge for the bump pull request, so it merges once its
          checks pass. Needs "Allow auto-merge" in the repository's settings.
        type: boolean
        default: false
      canary-ref:
        description: >-
          The ref of bynk-lang/.github to take the issue and report scripts
          from. Keep it in step with the ref this workflow is called at.
        type: string
        default: v1
    secrets:
      report-url:
        description: Ignored. Reports are authenticated by the run's OIDC token; declared so callers that still pass it keep working.
        required: false
      report-key:
        description: Ignored, as report-url.
        required: false
      BUMP_APP_ID:
        description: >-
          The client id of the GitHub App that opens bump pull requests
          (repository permissions Contents and Pull requests, read and write).
          An organisation secret; `secrets: inherit` passes it.
        required: false
      BUMP_APP_KEY:
        description: That App's private key.
        required: false
    outputs:
      result:
        description: '"pass" or "fail".'
        value: ${{ jobs.result.outputs.result }}
      bynk-version:
        description: The exact Bynk version tested, bare ("0.303.4").
        value: ${{ jobs.result.outputs.bynk-version }}

permissions: {}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.outcome.outputs.result }}
      bynk-version: ${{ steps.version.outputs.bynk-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Resolve once; bynk-ci and bynk-deploy then install this exact version
      # from the tool cache, so the run records what it actually tested.
      - name: Resolve Bynk
        id: setup
        uses: bynk-lang/setup-bynk@v1
        with:
          version: ${{ inputs.version }}

      - name: Record the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
          RESOLVED: ${{ steps.setup.outputs.version }}
        run: |
          echo "bynk-version=${RESOLVED#v}" >> "$GITHUB_OUTPUT"
          echo "### Bynk canary: Bynk ${RESOLVED#v} (requested \`${REQUESTED}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Bynk CI
        id: ci
        if: inputs.ci
        continue-on-error: true
        uses: bynk-lang/bynk-ci@v1
        with:
          version: ${{ steps.version.outputs.bynk-version }}
          working-directory: ${{ inputs.working-directory }}
          source: ${{ inputs.source }}
          format: ${{ inputs.format && 'true' || 'false' }}

      - name: Bynk deploy, dry run
        id: deploy
        if: inputs.deploy-dry-run
        continue-on-error: true
        uses: bynk-lang/bynk-deploy@v2
        with:
          version: ${{ steps.version.outputs.bynk-version }}
          working-directory: ${{ inputs.working-directory }}
          dry-run: "true"

      # The check steps continue on error so that this job always reports an
      # outcome; the result job decides whether the run fails.
      - name: Outcome
        id: outcome
        env:
          CI_OUTCOME: ${{ steps.ci.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          UPSTREAM: ${{ inputs.upstream-result }}
        run: |
          result=pass
          for o in "$CI_OUTCOME" "$DEPLOY_OUTCOME"; do
            case "$o" in success|skipped) ;; *) result=fail ;; esac
          done
          if [ "$CI_OUTCOME" = skipped ] && [ "$DEPLOY_OUTCOME" = skipped ] && [ -z "$UPSTREAM" ]; then
            echo "::warning::Neither ci, deploy-dry-run nor upstream-result is set; nothing was checked"
          fi
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            echo "| bynk-ci | ${CI_OUTCOME} |"
            echo "| bynk-deploy dry run | ${DEPLOY_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"

  result:
    name: Result
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write   # the report is authenticated by this run's OIDC token
    outputs:
      result: ${{ steps.decide.outputs.result }}
      bynk-version: ${{ steps.decide.outputs.bynk-version }}
    steps:
      # If the checks job failed outright (say, setup-bynk could not install
      # the version), there is no outcome: that is a fail, at the version asked for.
      - name: Decide
        id: decide
        env:
          CHECKS: ${{ needs.checks.result }}
          OUTCOME: ${{ needs.checks.outputs.result }}
          RESOLVED: ${{ needs.checks.outputs.bynk-version }}
          REQUESTED: ${{ inputs.version }}
          UPSTREAM: ${{ inputs.upstream-result }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result="${OUTCOME:-fail}"
          [ "$CHECKS" = success ] || result=fail
          case "$UPSTREAM" in ""|success|skipped) ;; *) result=fail ;; esac
          version="${RESOLVED:-${REQUESTED#v}}"
          {
            echo "result=${result}"
            echo "bynk-version=${version}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Bynk canary result: ${result}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Bynk | ${version} |"
            echo "| Caller's own checks | ${UPSTREAM:-none} |"
            echo "| Commit | ${COMMIT_SHA} |"
            echo "| Run | ${RUN_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch the canary scripts
        if: needs.checks.result != 'cancelled'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bynk-lang/.github
          ref: ${{ inputs.canary-ref }}
          path: .bynk-canary
          sparse-checkout: canary/scripts
          persist-credentials: false

      - name: Issue
        if: inputs.open-issue && needs.checks.result != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BYNK_VERSION: ${{ steps.decide.outputs.bynk-version }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ steps.decide.outputs.result }}
        run: .bynk-canary/canary/scripts/issue.sh "$RESULT"

      - name: Report
        if: needs.checks.result != 'cancelled' && inputs.report
        continue-on-error: true
        env:
          BOARD_URL: ${{ inputs.board-url }}
          REPO: ${{ github.repository }}
          KIND: ${{ inputs.kind }}
          BYNK_VERSION: ${{ steps.decide.outputs.bynk-version }}
          RESULT: ${{ steps.decide.outputs.result }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .bynk-canary/canary/scripts/report.sh

      - name: Fail the run
        if: steps.decide.outputs.result == 'fail' && inputs.fail-run
        env:
          BYNK_VERSION: ${{ steps.decide.outputs.bynk-version }}
        run: |
          echo "::error::The canary fails with Bynk ${BYNK_VERSION}"
          exit 1

  # The org does not let GITHUB_TOKEN open pull requests, and a pull request
  # it opened would start no workflows, so the bump goes through a GitHub App.
  # Only a pass on the default branch counts: a manual run on another branch
  # tested that branch, not what the bump would change.
  bump:
    name: Propose the pin bump
    needs: result
    if: >-
      inputs.bump && needs.result.outputs.result == 'pass'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # the App token does the writing
    steps:
      - name: Check the App secrets
        id: secrets
        env:
          APP_ID: ${{ secrets.BUMP_APP_ID }}
          APP_KEY: ${{ secrets.BUMP_APP_KEY }}
          BYNK_VERSION: ${{ needs.result.outputs.bynk-version }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::bump is on, but BUMP_APP_ID / BUMP_APP_KEY did not reach the canary (does the caller pass secrets: inherit?), so it cannot propose moving BYNK_VERSION to ${BYNK_VERSION}"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the bump token
        if: steps.secrets.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the default branch
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch the canary scripts
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bynk-lang/.github
          ref: ${{ inputs.canary-ref }}
          path: .bynk-canary
          sparse-checkout: canary/scripts
          persist-credentials: false

      - name: Move the pins
        if: steps.secrets.outputs.configured == 'true'
        id: apply
        env:
          BYNK_VERSION: ${{ needs.result.outputs.bynk-version }}
        run: .bynk-canary/canary/scripts/bump.sh apply "$BYNK_VERSION"

      - name: Open or update the bump pull request
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          FROM: ${{ steps.apply.outputs.from }}
          TO: ${{ steps.apply.outputs.to }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTO_MERGE: ${{ inputs.bump-auto-merge }}
        run: |
          uid="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          BOT_NAME="${APP_SLUG}[bot]" BOT_EMAIL="${uid}+${APP_SLUG}[bot]@users.noreply.github.com" \
            .bynk-canary/canary/scripts/bump.sh propose
