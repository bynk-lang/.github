# Deploy a Bynk project to Cloudflare Workers.
# `bynk deploy` provisions each context's resources (KV namespaces, queues,
# secrets) and deploys every context in Service Binding order.
#
# Set these as repository or organisation secrets first:
#   CLOUDFLARE_API_TOKEN   — a Cloudflare API token with Workers deploy scope
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account ID
#
# If the project uses KV, run `bynk deploy` locally once and commit
# bynk.deploy.lock: CI will not create a KV namespace it cannot record.
name: Deploy Bynk to Cloudflare

on:
  push:
    branches: ["$default-branch"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bynk-lang/bynk-deploy@422b47aeb37ba7ad0d8ba1f87755ae7e422dc462 # v2.2.2
        with:
          version: latest   # pin an exact version for reproducible deploys
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Actor `auth` secrets, as dotenv lines from repository secrets:
          # secrets: |
          #   AUTH_JWT_SECRET=${{ secrets.AUTH_JWT_SECRET }}
