# Bynk canary: re-run this repository's checks against a new Bynk release, and
# keep a `canary` issue open while they fail.
#
# There is deliberately no `schedule` here. GitHub disables scheduled workflows
# in a public repository after 60 days without activity; instead, the central
# dispatcher in bynk-lang/.github sends a `bynk-canary` repository_dispatch to
# every enrolled repository when Bynk is released (and weekly).
#
# To enrol, as well as adding this file to the default branch:
#   1. add the repository to canary/repos.json in bynk-lang/.github, with its
#      `kind` (`example` or `action`, matching `kind:` below);
#   2. install the org's canary GitHub App on the repository.
# See https://github.com/bynk-lang/.github/blob/main/canary/README.md
name: Bynk canary

on:
  repository_dispatch:
    types: [bynk-canary]
  workflow_dispatch:
    inputs:
      version:
        description: Bynk version, exact ("0.303.4") or "latest"
        type: string
        default: latest

permissions:
  contents: read
  issues: write
  id-token: write   # the result is reported with this run's GitHub OIDC token

jobs:
  canary:
    name: Canary
    uses: bynk-lang/.github/.github/workflows/canary.yml@v1
    with:
      version: ${{ github.event.client_payload.version || inputs.version || 'latest' }}
      kind: example          # `action` for one of the org's actions
      source: src            # `.` to include a tests/ directory
      # deploy-dry-run: true # also plan a deploy with bynk-deploy@v2, offline
