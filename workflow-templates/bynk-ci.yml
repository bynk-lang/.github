# Bynk CI — format check, type check, and tests.
# Diagnostics are annotated inline on pull requests.
name: Bynk CI

on:
  push:
    branches: ["$default-branch"]
  pull_request:
    branches: ["$default-branch"]

permissions:
  contents: read

jobs:
  bynk:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bynk-lang/bynk-ci@v1
        with:
          version: latest   # pin an exact version for reproducible CI
          source: src
          # `bynkc fmt` takes files only, so the format check fails on a
          # directory source. Off until it walks directories:
          # https://github.com/accuser/bynk/issues/1753
          format: "false"
